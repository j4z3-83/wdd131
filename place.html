<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jared Aldridge">
    <meta name="Country" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jared Aldridge, WDD131, Country page for Dynamic Web Fundamentals">
    <title>WDD 131: Dynamic Web Fundamentals Country page - Jared Aldridge</title>
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/place.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body onload="calculateWindChill(26, 18)">
    <header>
        <h1>United Kingdom</h1>
    </header>
    <main>
        <div class="hero">
            <picture>
                <source srcset="images/place-hero-image-4-large.webp" media="(min-width: 1250px)" >
                <source srcset="images/place-hero-image-3-medium-large.webp" media="(min-width: 1000px)">
                <source srcset="images/place-hero-image-2-medium.webp" media="(min-width: 750px)">
                <source srcset="images/place-hero-image-1-small.webp" media="(min-width: 500px)">
                <img src="images/place-hero-image-phone.webp" alt="British Royal Guard on duty">
            </picture>
        </div>
        <div class="databox">  
            <section class="data">
                <h2>Data</h2>
                <table>
                    <tr>
                        <th>Area:</th>
                        <td>244,376 sq km</td>
                    </tr>
                    <tr>
                        <th>Population:</th>
                        <td>69,931,528</td>
                    </tr>                    
                    <tr>
                        <th>Capital:</th>
                        <td>London</td>
                    </tr>
                    <tr>
                        <th>Currency:</th>
                        <td>Pound Sterling</td>
                    </tr>
                    <tr>
                        <th>Time Zone:</th>
                        <td>UTC+0</td>
                    </tr>
                    <tr>
                        <th>Calling Code:</th>
                        <td>+44</td>
                    </tr>
                    <tr>
                        <th>Internet TLD</th>
                        <td>.co.uk</td>
                    </tr>
                </table>
            </section>
        </div>
        <div class="weatherbox">    
            <section class="weather">
                <h2>Weather</h2>
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-cloud-sun" viewBox="0 0 16 16">
                <path d="M7 8a3.5 3.5 0 0 1 3.5 3.555.5.5 0 0 0 .624.492A1.503 1.503 0 0 1 13 13.5a1.5 1.5 0 0 1-1.5 1.5H3a2 2 0 1 1 .1-3.998.5.5 0 0 0 .51-.375A3.5 3.5 0 0 1 7 8m4.473 3a4.5 4.5 0 0 0-8.72-.99A3 3 0 0 0 3 16h8.5a2.5 2.5 0 0 0 0-5z"/>
                <path d="M10.5 1.5a.5.5 0 0 0-1 0v1a.5.5 0 0 0 1 0zm3.743 1.964a.5.5 0 1 0-.707-.707l-.708.707a.5.5 0 0 0 .708.708zm-7.779-.707a.5.5 0 0 0-.707.707l.707.708a.5.5 0 1 0 .708-.708zm1.734 3.374a2 2 0 1 1 3.296 2.198q.3.423.516.898a3 3 0 1 0-4.84-3.225q.529.017 1.028.129m4.484 4.074c.6.215 1.125.59 1.522 1.072a.5.5 0 0 0 .039-.742l-.707-.707a.5.5 0 0 0-.854.377M14.5 6.5a.5.5 0 0 0 0 1h1a.5.5 0 0 0 0-1z" fill="#fce205" />
                </svg>
                <table>
                    <tr>
                        <th>Temperature:</th>
                        <td id="temperature">26 &deg;C</td>
                    </tr>
                    <tr>
                        <th>Conditions:</th>
                        <td>Mostly Sunny</td>
                    </tr>
                    <tr>
                        <th>Wind</th>
                        <td id="windspeed">18 km/h</td>
                    </tr>
                    <tr>
                        <th>Wind Chill:</th>
                        <td id="windchill"></td>
                    </tr>
                </table>
            </section>
        </div>
    </main>
    <footer>
        <p><span id="currentYear"></span>, 🍁 Jared Aldridge, 🍁 Canada</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
